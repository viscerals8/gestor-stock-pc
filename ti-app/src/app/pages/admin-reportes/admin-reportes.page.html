<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Reportes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="reportes-wrapper">
    <h1>Reportes del sistema</h1>
    <p class="subtitulo">Descargá un CSV con los datos actuales de la base.</p>

    <ion-list lines="none" class="lista-reportes">
      <ion-item button (click)="descargar('Inventario')">
        <ion-icon slot="start" name="hardware-chip-outline" color="primary"></ion-icon>
        <ion-label>Reporte de Inventario</ion-label>
      </ion-item>
      <ion-item button (click)="descargar('Historial de PCs')">
        <ion-icon slot="start" name="time-outline" color="primary"></ion-icon>
        <ion-label>Historial de PCs</ion-label>
      </ion-item>
      <ion-item button (click)="descargar('Tareas Técnicas')">
        <ion-icon slot="start" name="list-outline" color="primary"></ion-icon>
        <ion-label>Reporte de Tareas</ion-label>
      </ion-item>
      <ion-item button (click)="descargar('Usuarios')">
        <ion-icon slot="start" name="people-outline" color="primary"></ion-icon>
        <ion-label>Reporte de Usuarios</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
