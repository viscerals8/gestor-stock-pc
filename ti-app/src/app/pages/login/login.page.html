

<ion-content class="ion-padding">
  <div class="login-container">
    <img src="assets/logo.png" alt="Logo Empresa" class="logo" />

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Correo -->
      <ion-item>
        <ion-label position="floating">Correo</ion-label>
        <ion-input
          type="email"
          formControlName="correo"
          required>
        </ion-input>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="loginForm.get('correo')?.touched && loginForm.get('correo')?.invalid">
        <p>Correo inválido</p>
      </ion-text>

      <!-- Contraseña -->
      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password">
        </ion-input>
        <ion-button
          fill="clear"
          slot="end"
          size="small"
          type="button"
          (click)="togglePassword()">
          <p>{{ passwordVisible ? 'Ocultar' : 'Mostrar' }}</p>
        </ion-button>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        <p>Contraseña requerida (mín. 4 caracteres)</p>
      </ion-text>

      <!-- Botón ingresar -->
      <ion-button
        expand="block"
        type="submit"
        [disabled]="loginForm.invalid">
        Ingresar
      </ion-button>
    </form>

    <!-- Mensaje de error general -->
    <ion-text color="danger" *ngIf="errorMessage">
      <p>{{ errorMessage }}</p>
    </ion-text>
  </div>
</ion-content>
